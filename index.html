<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Provenance Lab: a clinical informatics teaching lab on results pending at discharge. Prototype with synthetic patient data.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Provenance Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a chart workstation. Source evidence left, AI draft center, provenance inspector right; stacks to one column on phones.
   Palette: Gossamer. Clean white (#FAFAFA) and light gray (#CDCDCF) ground, mid gray (#939599), turquoise (#2BCFCE) for selection, coral (#EC4D25) for actions.
   Light mode deepens both accents so text stays readable; dark mode uses them near full strength.
   Type: Newsreader for headings, Instrument Sans for reading and labels, Plex Mono for record IDs. */
:root {
  --paper: #FAFAFA;
  --surface: #FFFFFF;
  --sunk: #EDEDEF;
  --ink: #1E2024;
  --muted: #5C5F65;
  --rule: #CDCDCF;
  --accent: #0B7A79;
  --accent-soft: rgba(43, 207, 206, 0.14);
  --link-soft: rgba(43, 207, 206, 0.22);
  --btn-bg: #C23D1A;
  --btn-fg: #FFFFFF;
  --flag: #F5A68F;
  --flag-soft: rgba(236, 77, 37, 0.16);
  --ok: #2E7A4E;
  --ok-soft: rgba(46, 122, 78, 0.1);
  --warn: #8F5A00;
  --warn-soft: rgba(196, 128, 20, 0.12);
  --bad: #B3261E;
  --bad-soft: rgba(179, 38, 30, 0.08);
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17181B; --surface: #202125; --sunk: #2A2B30; --ink: #FAFAFA; --muted: #A3A5AA; --rule: #393B40;
    --accent: #2BCFCE; --accent-soft: rgba(43, 207, 206, 0.14); --link-soft: rgba(43, 207, 206, 0.2); --btn-bg: #F26A45; --btn-fg: #17181B;
    --flag: #F2876A; --flag-soft: rgba(236, 77, 37, 0.22); --ok: #7DD3A0; --ok-soft: rgba(125, 211, 160, 0.12);
    --warn: #F0B86E; --warn-soft: rgba(240, 184, 110, 0.12); --bad: #FF8F85; --bad-soft: rgba(255, 143, 133, 0.12); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17181B; --surface: #202125; --sunk: #2A2B30; --ink: #FAFAFA; --muted: #A3A5AA; --rule: #393B40;
  --accent: #2BCFCE; --accent-soft: rgba(43, 207, 206, 0.14); --link-soft: rgba(43, 207, 206, 0.2); --btn-bg: #F26A45; --btn-fg: #17181B;
  --flag: #F2876A; --flag-soft: rgba(236, 77, 37, 0.22); --ok: #7DD3A0; --ok-soft: rgba(125, 211, 160, 0.12);
  --warn: #F0B86E; --warn-soft: rgba(240, 184, 110, 0.12); --bad: #FF8F85; --bad-soft: rgba(255, 143, 133, 0.12); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; letter-spacing: -0.005em; }
p { margin: 0; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 0.82em; }
.label { font-family: var(--display); font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.wrap { max-width: 1320px; margin: 0 auto; }

/* Top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 14px; border-bottom: 1px solid var(--rule); margin-bottom: 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 18px; letter-spacing: -0.01em; }
.brand .mono { color: var(--muted); }
.bar-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); background: var(--surface); white-space: nowrap; }
.pill.warn { color: var(--warn); border-color: transparent; background: var(--warn-soft); }
.btn { border: 1px solid var(--rule); background: var(--surface); padding: 7px 14px; border-radius: var(--radius); font-weight: 500; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* Intro */
.intro { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.intro-lead h2 { font-size: clamp(26px, 3.4vw, 38px); letter-spacing: -0.02em; max-width: 18ch; }
.intro-lead > p { margin-top: 14px; max-width: 60ch; color: var(--muted); font-size: 16px; }
.steps { margin-top: 24px; display: grid; gap: 12px; max-width: 60ch; padding: 0; list-style: none; counter-reset: step; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; counter-increment: step; }
.steps li::before { content: counter(step); font-family: var(--mono); font-size: 12px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); }
.setup { padding: 20px; display: grid; gap: 18px; }
.case-list { display: grid; gap: 8px; }
.case-opt { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: var(--radius); text-align: left; background: var(--surface); }
.case-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.case-opt strong { font-weight: 600; }
.case-opt span.sub { grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; }
.objective { font-size: 14px; color: var(--muted); border-left: 2px solid var(--rule); padding-left: 12px; }
.check-line { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.dot.bad { background: var(--bad); }

/* Workstation */
.task { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; margin-bottom: 16px; background: var(--accent-soft); border-radius: var(--radius); }
.task-text { display: grid; gap: 6px; min-width: 0; flex: 1 1 520px; }
.task p { max-width: 95ch; }
.task .label { color: var(--accent); margin-right: 8px; }
.patient { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; padding: 10px 16px; margin-bottom: 16px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
.patient strong { font-family: var(--display); font-size: 16px; }
.patient span { color: var(--muted); font-size: 13.5px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 0.95fr); gap: 16px; align-items: start; }
.col { min-width: 0; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.pane-body { padding: 12px 16px 16px; }
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tab { border: none; background: none; padding: 8px 10px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.source-scroll { max-height: 64vh; overflow-y: auto; }
.tline { display: grid; grid-template-columns: 34px 70px minmax(0, 1fr); gap: 8px; padding: 7px 8px; border-radius: 4px; font-size: 14px; transition: background 0.2s; }
.tline .mono { color: var(--muted); padding-top: 2px; }
.tline .who { font-size: 12.5px; color: var(--muted); padding-top: 1px; }
.tline.hl { background: var(--link-soft); }
.tline.hl .mono { color: var(--accent); font-weight: 500; }
.rec { padding: 10px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
.rec:last-child { border-bottom: none; }
.rec .meta { font-size: 12.5px; color: var(--muted); }
.rec.hl { background: var(--link-soft); margin-inline: -8px; padding-inline: 8px; border-radius: 4px; }

.note-head { display: grid; gap: 2px; }
.note-head h3 { font-size: 16px; }
.note-head span { font-size: 12.5px; color: var(--muted); }
.note-sec { padding-top: 10px; }
.note-sec + .note-sec { border-top: 1px dashed var(--rule); margin-top: 10px; }
.stmt { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 6px; align-items: start; width: 100%; text-align: left; border: 1px solid transparent; background: none; padding: 7px 8px; border-radius: 4px; margin-top: 4px; }
.stmt:hover { background: var(--sunk); }
.stmt[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.stmt .mono { color: var(--muted); padding-top: 2px; }
.stmt .txt { min-width: 0; }
.stmt.flagged .txt { background: var(--flag-soft); box-shadow: 0 0 0 2px var(--flag-soft); border-radius: 2px; }
.stmt .deleted { text-decoration: line-through; color: var(--muted); }
.stmt .edited { display: block; font-size: 13px; color: var(--accent); margin-top: 2px; }
.marks { display: flex; gap: 4px; align-items: center; padding-top: 2px; }
.mk { font-size: 11px; font-family: var(--mono); padding: 1px 5px; border-radius: 3px; background: var(--sunk); color: var(--muted); }
.mk.flag { background: var(--flag); color: #1E2024; }
.mk.dec { background: var(--accent-soft); color: var(--accent); }

.inspector { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0 4px; display: grid; gap: 8px; }
.insp-stmt { font-size: 15px; padding: 10px 12px; background: var(--sunk); border-radius: 4px; margin: 8px 0 12px; }
.insp-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.prov { margin-top: 14px; display: grid; gap: 8px; }
.prov-item { border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px; font-size: 13.5px; display: grid; gap: 2px; }
.prov-item .k { font-size: 12px; color: var(--muted); }
.prov-none { border-style: dashed; color: var(--warn); }
.locked { font-size: 13.5px; color: var(--muted); border: 1px dashed var(--rule); border-radius: 4px; padding: 10px 12px; margin-top: 14px; }
.decide { margin-top: 16px; display: grid; gap: 10px; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 4px; font-size: 14px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
textarea { width: 100%; min-height: 64px; resize: vertical; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); font-size: 14px; }
.fb { border-radius: 4px; padding: 10px 12px; font-size: 14px; display: grid; gap: 4px; }
.fb strong { font-family: var(--display); font-size: 13px; letter-spacing: 0.02em; }
.fb.accepted { background: var(--ok-soft); } .fb.accepted strong { color: var(--ok); }
.fb.defensible, .fb.partial { background: var(--warn-soft); } .fb.defensible strong, .fb.partial strong { color: var(--warn); }
.fb.not { background: var(--bad-soft); } .fb.not strong { color: var(--bad); }
.fb .ref { color: var(--muted); font-size: 13.5px; }

.sign-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-top: 16px; padding: 12px 16px; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); }
.sign-bar p { color: var(--muted); font-size: 14px; }
.confirm { margin-top: 12px; padding: 14px 16px; border: 1px solid var(--warn); border-radius: var(--radius); background: var(--warn-soft); display: grid; gap: 10px; }
.confirm .row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Debrief */
.debrief { display: grid; gap: 20px; max-width: 980px; }
.debrief h2 { font-size: clamp(24px, 3vw, 32px); letter-spacing: -0.02em; }
.event { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; }
.event .label { color: var(--bad); }
.event .note { font-size: 13px; color: var(--muted); }
.sec { padding: 18px 20px; display: grid; gap: 12px; }
.sec h3 { font-size: 17px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.stat { display: grid; }
.stat b { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 620px; }
th { text-align: left; font-family: var(--display); font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--rule); }
td { padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:last-child td { border-bottom: none; }
.v { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.v.accepted { background: var(--ok-soft); color: var(--ok); }
.v.defensible, .v.partial { background: var(--warn-soft); color: var(--warn); }
.v.not { background: var(--bad-soft); color: var(--bad); }
.signed p { padding: 3px 0; }
.signed .sec-name { margin-top: 8px; }
.signed .ver { font-size: 12px; color: var(--muted); }
blockquote { margin: 0; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 4px 4px 0; font-size: 14.5px; }
.checklist { display: grid; gap: 6px; }
.checklist label { display: flex; gap: 8px; align-items: flex-start; font-size: 14.5px; }
.checklist input { margin-top: 4px; accent-color: var(--accent); }
ul.points { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 72ch; }
.actions-row { display: flex; flex-wrap: wrap; gap: 8px; }
.toast { font-size: 13px; color: var(--ok); }
.log { font-family: var(--mono); font-size: 12.5px; color: var(--muted); max-height: 220px; overflow-y: auto; display: grid; gap: 2px; }
details summary { cursor: pointer; font-weight: 500; }
.example-note { font-size: 13px; color: var(--muted); }


.mode { font-family: var(--display); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; align-self: center; justify-self: end; }
.mode.easy { background: var(--ok-soft); color: var(--ok); }
.mode.hard { background: var(--bad-soft); color: var(--bad); }
.cite-hint { font-size: 12.5px; color: var(--accent); }
.search { display: flex; align-items: center; gap: 8px; padding: 8px 16px 0; }
.search input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); font-size: 14px; }
.search .mono { color: var(--muted); white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tline.citable, .rec.citable { cursor: pointer; }
.tline.citable:hover { background: var(--sunk); }
.rec.citable:hover { background: var(--sunk); margin-inline: -8px; padding-inline: 8px; border-radius: 4px; }
.tline.cited, .rec.cited { background: var(--link-soft); box-shadow: inset 3px 0 0 var(--accent); }
.rec.cited { margin-inline: -8px; padding-inline: 8px; border-radius: 4px; }
.tline.cited .mono { color: var(--accent); font-weight: 500; }
.tline.ref, .rec.ref { outline: 2px solid var(--ok); outline-offset: -2px; }
.tline.dim { opacity: 0.4; }
mark { background: var(--flag-soft); color: inherit; border-radius: 2px; padding: 0 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 12.5px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); }
.err-tag { font-family: var(--display); font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bad); }

/* Lab */
.case-opt.featured { border-width: 2px; }
.mode.lab { background: var(--accent-soft); color: var(--accent); }
.stepper { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.stepper li { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); padding: 6px 12px 6px 6px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); }
.stepper li .mono { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); }
.stepper li.cur { color: var(--ink); border-color: var(--accent); font-weight: 600; }
.stepper li.cur .mono { background: var(--accent); color: var(--paper); }
.stepper li.done .mono { background: var(--ok-soft); color: var(--ok); }
.brief { padding: 24px; display: grid; gap: 14px; max-width: 860px; }
.brief h2 { font-size: clamp(24px, 3vw, 32px); letter-spacing: -0.02em; }
.brief > p { max-width: 68ch; font-size: 15.5px; }
.brief .task { margin: 0; }
.chain-panel { padding: 14px 16px; margin-bottom: 16px; display: grid; gap: 6px; }
.chain-wrap { display: grid; gap: 6px; }
.chain-wrap + .chain-wrap { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--rule); }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.st { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--rule); color: var(--muted); background: var(--surface); }
.st.on { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.st.miss { border: 1px dashed var(--bad); background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.chain .arr { color: var(--muted); font-size: 13px; }
.lab-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; align-items: start; margin-bottom: 16px; }
.lab-grid > section { min-width: 0; }
.tl { display: grid; gap: 4px; }
.ev { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: start; text-align: left; padding: 8px; border: 1px solid transparent; border-radius: 4px; background: none; }
.ev:hover { background: var(--sunk); }
.ev[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ev .mono { color: var(--muted); padding-top: 2px; }
.ev > span:nth-child(2) { display: grid; min-width: 0; }
.ev-when { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.ev-actor { font-size: 13px; color: var(--muted); }
.ev.opened .mk { background: var(--ok-soft); color: var(--ok); }
.ev-title { font-size: 17px; }
.ev-meta { font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
.prov-table { min-width: 0; margin-top: 12px; font-size: 13.5px; }
.prov-table th { text-transform: none; letter-spacing: 0; font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--muted); width: 42%; }
fieldset.q { border: none; padding: 0; margin: 0; display: grid; gap: 8px; }
fieldset.q + fieldset.q { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--rule); }
fieldset.q legend { font-weight: 600; padding: 0; margin-bottom: 8px; }
.replay { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid var(--rule); display: grid; gap: 14px; }
.replay li { display: grid; gap: 2px; position: relative; }
.replay li::before { content: ""; position: absolute; left: -22px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--rule); }
.replay li.new::before { background: var(--accent); }
.replay li p { color: var(--muted); max-width: 70ch; }
.lever { padding: 18px 20px; margin-bottom: 14px; display: grid; gap: 14px; }
.lever-head { display: grid; gap: 6px; }
.lever-head h3 { font-size: 17px; }
.pill.finding { justify-self: start; color: var(--bad); border-color: transparent; background: var(--bad-soft); }
.lever-why { color: var(--muted); max-width: 75ch; }
.lever-ev { font-size: 13.5px; max-width: 80ch; }
.lever-ev .label { color: var(--accent); margin-right: 4px; }

/* ============ VALIDATION ============ */
const DEFAULT_OPTIONS = [
  { key: "keep", label: "Keep as written" },
  { key: "verify", label: "Keep after I verify it myself" },
  { key: "correct", label: "Correct it to match the source" },
  { key: "remove", label: "Remove it" }
];
function validateCase(c) {
  const errs = [];
  const tIds = new Set(c.transcript.map(t => t.id));
  const chartIds = new Set([...(c.chart.meds || []), ...(c.chart.vitals || [])].map(r => r.id));
  const known = id => tIds.has(id) || chartIds.has(id);
  const optKeys = (c.options || DEFAULT_OPTIONS).map(o => o.key);
  const verdicts = new Set(["accepted", "defensible", "partial", "not"]);
  const inSections = new Set(c.sections.flatMap(s => s.stmts));
  Object.entries(c.statements).forEach(([sid, s]) => {
    if (!inSections.has(sid)) errs.push(sid + " is not placed in any note section");
    s.links.forEach(l => l.ids.forEach(id => { if (!known(id)) errs.push(sid + " links to missing " + id); }));
    (s.alsoOk || []).forEach(id => { if (!known(id)) errs.push(sid + " alsoOk lists missing " + id); });
    if (!s.links.length && !s.noLinkNote) errs.push(sid + " has no source and no explanation");
    optKeys.forEach(k => { const f = s.fb[k]; if (!f) errs.push(sid + " has no feedback for " + k); else if (!verdicts.has(f[0])) errs.push(sid + " has an invalid verdict for " + k); });
    if (!optKeys.includes(s.reference)) errs.push(sid + " reference option is invalid");
    if (s.fb[s.reference] && s.fb[s.reference][0] !== "accepted") errs.push(sid + " reference option is not marked accepted");
    if (s.error && s.reference === "keep") errs.push(sid + " is marked as an error but its reference is keep");
  });
  inSections.forEach(sid => { if (!c.statements[sid]) errs.push("Section lists missing " + sid); });
  if (!c.task) errs.push("No task prompt");
  if (!c.role) errs.push("No role framing");
  if (!c.reflect || !c.reflect.length) errs.push("No reflection prompts");
  if (c.consequence && !c.statements[c.consequence.when.stmt]) errs.push("Consequence refers to a missing statement");
  return errs;
}

function sourceCheck(sid) {
  const s = C.statements[sid], ref = refIds(sid), ok = new Set(s.alsoOk || []);
  const cited = S.cites[sid] || [], none = S.nosrc.includes(sid);
  if (!ref.length) {
    if (none) return ["accepted", "Right. No line in the record supports this statement."];
    if (cited.length && cited.every(id => ok.has(id))) return ["defensible", "Those lines are related, but none of them actually says this."];
    return ["not", "No line supports this statement, and the lines you picked do not say it."];
  }
  if (none || !cited.length) return ["not", "Missed. The evidence is at " + listNames(ref) + "."];
  const hits = cited.filter(id => ref.includes(id));
  const extra = cited.filter(id => !ref.includes(id) && !ok.has(id));
  if (!hits.length) return ["not", "Not the deciding lines. The evidence is at " + listNames(ref) + "."];
  const missing = ref.filter(id => !hits.includes(id));
  if (missing.length) return ["partial", "Found " + listNames(hits) + ", but the full picture also needs " + listNames(missing) + "."];
  if (extra.length) return ["defensible", "Found " + listNames(hits) + ". " + listNames(extra) + " do not bear on this statement."];
  return ["accepted", "Found it: " + listNames(hits) + "."];
}

    if (!q) { span.textContent = t.text; el.classList.remove("dim"); return; }
    if (i < 0) { span.textContent = t.text; el.classList.add("dim"); }
    else { n++; span.innerHTML = esc(t.text.slice(0, i)) + "<mark>" + esc(t.text.slice(i, i + q.length)) + "</mark>" + esc(t.text.slice(i + q.length)); el.classList.remove("dim"); }
  });
  const c = $("#search-count"); if (c) c.textContent = q ? n + (n === 1 ? " line" : " lines") : "";
}

function finalText(sid) {
  const d = S.decisions[sid];
  if (d && d.option === "correct" && d.text) return d.text;
  return C.statements[sid].text;
}

function stmtRow(sid) {
  const s = C.statements[sid], d = S.decisions[sid], flagged = S.flags.includes(sid);
  const nCited = (S.cites[sid] || []).length;
  return `<button class="stmt ${flagged ? "flagged" : ""}" data-stmt="${sid}" aria-current="${S.selected === sid}">

    <span class="marks">${flagged ? `<span class="mk flag">flag</span>` : ""}${isFind() && (nCited || S.nosrc.includes(sid)) ? `<span class="mk">${nCited ? nCited + " cited" : "no src"}</span>` : ""}${d ? `<span class="mk dec">${esc(d.option)}</span>` : ""}</span>
  </button>`;
}

function evidencePanel(sid) {

    return `<div class="prov">
      <p class="label">Your evidence</p>

function todoList(items) {
  if (items.every(i => i.done)) return "";
  return `<div class="todo" role="status" aria-live="polite"><span class="label">To continue</span><ul>${items.map(i => `<li class="${i.done ? "done" : ""}"><span class="tick" aria-hidden="true">${i.done ? "✓" : "○"}</span>${esc(i.text)}${i.done ? '<span class="sr"> (done)</span>' : ""}</li>`).join("")}</ul></div>`;
}
const norm = t => String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function correctionProblem(original, text) {
  if (!norm(text)) return "Write the corrected wording before recording this decision.";
  if (norm(text) === norm(original)) return "Your wording is the same as the draft. Change it to match the source, or choose another option.";
  return "";
}

function consequenceFires() {
  const w = C.consequence?.when; if (!w) return false;
  const d = S.decisions[w.stmt];
  if (d && d.option === "correct" && norm(d.text) === norm(C.statements[w.stmt].text)) return true;
  return w.decisions.includes(d ? d.option : null);
}

function debrief() {
  const ids = Object.keys(C.statements);

  }).join("");
  const signed = C.sections.map(sec => `<p class="label sec-name">${esc(sec.name)}</p>` + sec.stmts.map(i => {
    const d = S.decisions[i];
    if (d && d.option === "remove") return "";
    return `<p>${esc(finalText(i))}${d && d.option === "verify" ? ` <span class="ver">(verified by signer)</span>` : ""}</p>`;
  }).join("")).join("");
  return `<section class="debrief">
    <div><p class="label">Debrief · ${C.mode === "hard" ? "Hard mode" : "Easy mode"}</p><h2 style="margin-top:6px">Your path compared with the reference path</h2></div>
    ${consequenceFires() ? `<div class="event" role="note"><p class="label">${esc(C.consequence.title)}</p><p>${esc(C.consequence.text)}</p><p class="note">${esc(C.consequence.caveat)}</p></div>` : ""}
    <div class="panel sec">
      <h3>What you did</h3>

      <div class="stats">

        <div class="stat"><b>${checkedAcc}/${accurate.length}</b><span>accurate statements you checked</span></div>
        ${isFind() ? `<div class="stat"><b>${found}/${ids.length}</b><span>sources found</span></div>` : ""}
        <div class="stat"><b>${signEntry ? signEntry.t : "00:00"}</b><span>time spent verifying ${ids.length} statements</span></div>
      </div>
      <p class="example-note">${errors.length} of ${ids.length} statements contained an error. Checking the accurate ones is the cost of finding the rest. Action choices count what you decided to do with each error; your corrected wording is not checked automatically, so compare it with the expert revision below.</p>
    </div>
    <div class="panel sec">
      <h3>Statement by statement</h3>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>Draft statement</th><th>Your decision</th><th>Reference</th><th>Your action</th>${isFind() ? "<th>Source check</th>" : ""}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="example-note">Defensible means a reasonable clinician could choose it. More than one answer can be acceptable.</p>
    </div>
    <div class="panel sec signed">
      <h3>The note you signed</h3>
      <div>${signed}</div>
    </div>
    <div class="panel sec">
      <h3>Expert revision</h3>
      <blockquote>${esc(C.expertNote)}</blockquote>
      <p class="example-note">${esc(C.expertNoteAfter)}</p>
      <p class="label" style="margin-top:6px">Self-review checklist</p>
      <div class="checklist">${C.checklist.map((c, n) => `<label><input type="checkbox" id="chk-${n}" data-chk="${n}" ${S.checks.includes(n) ? "checked" : ""}><span>${esc(c)}</span></label>`).join("")}</div>
    </div>
    <div class="panel sec">
      <h3>Check your understanding</h3>
      ${C.reflectMC ? C.reflectMC.map(q => mcBlock(q, S.refl || (S.refl = {}), "case")).join("") : ""}
      <details class="optional-q"${C.reflectMC ? "" : " open"}><summary>${C.reflectMC ? "Optional: write your own reflection" : "Reflect"}</summary><ol style="margin:0 0 8px;padding-left:20px;display:grid;gap:4px">${C.reflect.map(q => `<li>${esc(q)}</li>`).join("")}</ol><textarea id="reflect" data-reflect placeholder="A few sentences.">${esc(S.reflection)}</textarea></details>
      <details><summary>Going further: ${esc(C.goingFurther.q)}</summary><p class="example-note" style="margin-top:6px">${esc(C.goingFurther.example)}</p></details>
    </div>

      <h3>Teaching points</h3>

    </div>
    <div class="panel sec">
      <h3>Session record</h3>
      <div class="log">${S.log.map(e => `<span>${esc(e.t)}  ${esc(e.action.padEnd(8))} ${esc(e.sid)} ${esc(e.detail)}</span>`).join("") || "<span>No actions logged.</span>"}</div>
      <div class="actions-row"><button class="btn" data-act="copy">Copy session summary</button><button class="btn primary" data-act="retry">Retry the case</button><button class="btn ghost" data-act="home">All cases</button>${S.copied ? `<span class="toast" aria-live="polite">Copied</span>` : ""}</div>
      <textarea id="copy-fallback" readonly hidden></textarea>
    </div>
  </section>`;
}

function summaryText() {
  const lines = [`Provenance Lab · ${C.id} v${C.version}`, ""];
  Object.keys(C.statements).forEach(i => {
    const d = S.decisions[i], opt = d ? d.option : "keep", v = C.statements[i].fb[opt][0];
    const sc = isFind() && d ? " | Source: " + SOURCE_LABEL[sourceCheck(i)[0]] : "";
    lines.push(`${i}: ${d ? optLabel(opt) : "Signed as written"} (${VERDICT_LABEL[v]})${sc}${d?.why ? " | Why: " + d.why : ""}`);
  });
  lines.push("", "Reflection: " + (S.reflection || "(none)"), "", "Log:");
  S.log.forEach(e => lines.push(`${e.t} ${e.action} ${e.sid} ${e.detail}`.trim()));
  return lines.join("\n");
}

function scrollToLinked() {
  if (isFind()) return;
  const ids = S.selected && S.inspected.includes(S.selected) ? refIds(S.selected) : [];
  if (!ids.length) return;
  const el = document.getElementById("line-" + ids[0]), box = $("#source");
  if (el && box && box.scrollHeight > box.clientHeight) box.scrollTo({ top: el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 8, behavior: "smooth" });
}

function toggleCite(id) {
  const sid = S.selected; if (!sid) return;
  const cur = S.cites[sid] || [];
  const on = !cur.includes(id);
  S.cites[sid] = on ? [...cur, id] : cur.filter(x => x !== id);
  S.nosrc = S.nosrc.filter(x => x !== sid);
  if (!S.inspected.includes(sid)) S.inspected.push(sid);
  log(on ? "cite" : "uncite", sid, id);
  save(); render();
}

function bind() {
  document.querySelectorAll("[data-case]").forEach(b => b.onclick = () => { save(); ACTIVE = "case"; C = CASES.find(c => c.id === b.dataset.case); S = load(C); S.screen = "intro"; save(); render(); });
  document.querySelectorAll("[data-module]").forEach(b => b.onclick = () => { ACTIVE = "lab"; L.screen = "home"; labSave(); render(); });
  bindLab();
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; save(); render(); if ($("#source")) $("#source").scrollTop = 0; });
  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { setState({ tab: b.dataset.goto }); scrollToLinked(); });
  document.querySelectorAll("[data-cite]").forEach(el => {
    el.onclick = () => toggleCite(el.dataset.cite);
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleCite(el.dataset.cite); } };
  });
  document.querySelectorAll("[data-uncite]").forEach(b => b.onclick = () => toggleCite(b.dataset.uncite));
  document.querySelectorAll("[data-stmt]").forEach(b => b.onclick = () => {
    const sid = b.dataset.stmt, s = C.statements[sid];
    if (isFind()) setState({ selected: sid });
    else { const tlink = s.links.find(l => l.kind === "transcript"); setState({ selected: sid, tab: tlink || !s.links.length ? "transcript" : s.links[0].tab }); scrollToLinked(); }
    if (window.innerWidth <= 1100) document.querySelector(".col-insp")?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => act(b.dataset.act));
  const search = $("#search");
  if (search) search.oninput = () => {
    S.search = search.value; save(); applySearch();
    const first = document.querySelector(".tline:not(.dim) mark"), box = $("#source");
    if (first && box) box.scrollTo({ top: first.closest(".tline").getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - 8, behavior: "smooth" });
  };
  const form = document.querySelector("[data-form]");
  if (form) {
    const sid = form.dataset.form;
    form.querySelectorAll("input[type=radio]").forEach(r => r.onchange = () => { S.drafts[sid] = Object.assign({}, S.drafts[sid], { option: r.value }); S.formError = null; save(); render(); });
    const ed = form.querySelector("[data-edit]"); if (ed) ed.oninput = () => { S.drafts[sid] = Object.assign({}, S.drafts[sid], { text: ed.value }); save(); };
    const why = form.querySelector("[data-why]"); if (why) why.oninput = () => { S.drafts[sid] = Object.assign({}, S.drafts[sid], { why: why.value }); save(); };
    form.onsubmit = e => {
      e.preventDefault();
      const dr = S.drafts[sid] || {}, prev = S.decisions[sid] || {};
      const option = dr.option ?? prev.option; if (!option) return;
      const dec = { option, why: (dr.why ?? prev.why ?? "").trim(), text: option === "correct" ? (dr.text ?? prev.text ?? C.statements[sid].text).trim() : "" };
      if (option === "correct") { const pb = correctionProblem(C.statements[sid].text, dec.text); if (pb) { S.formError = { sid, msg: pb }; save(); render(); return; } }
      S.formError = null;
      S.decisions[sid] = dec; delete S.drafts[sid];
      log("decide", sid, option + (dec.why ? " +reason" : ""));
      save(); render();
    };
  }
  const rf = document.querySelector("[data-reflect]"); if (rf) rf.oninput = () => { S.reflection = rf.value; save(); };
  if (S.screen === "debrief" && ACTIVE === "case") bindMC(S.refl || (S.refl = {}), save, "case");
  document.querySelectorAll("[data-chk]").forEach(c => c.onchange = () => {
    const n = Number(c.dataset.chk);
    S.checks = c.checked ? [...new Set([...S.checks, n])] : S.checks.filter(x => x !== n); save();
  });
}

function act(a) {
  const sid = S.selected;
  if (a === "start") { if (!S.start) { S.start = Date.now(); log("start", "", C.mode); } setState({ screen: "work" }); window.scrollTo(0, 0); }
  else if (a === "inspect" && sid) { if (!S.inspected.includes(sid)) { S.inspected.push(sid); log("inspect", sid); } save(); render(); scrollToLinked(); }
  else if (a === "nosrc" && sid) { const on = !S.nosrc.includes(sid); S.nosrc = on ? [...S.nosrc, sid] : S.nosrc.filter(x => x !== sid); if (on) S.cites[sid] = []; if (!S.inspected.includes(sid)) S.inspected.push(sid); log(on ? "nosource" : "undo-nosrc", sid); save(); render(); }
  else if (a === "flag" && sid) { const on = !S.flags.includes(sid); S.flags = on ? [...S.flags, sid] : S.flags.filter(x => x !== sid); log(on ? "flag" : "unflag", sid); save(); render(); }
  else if (a === "next") { const order = C.sections.flatMap(s => s.stmts); const i = order.indexOf(sid); setState({ selected: order[(i + 1) % order.length] }); scrollToLinked(); }
  else if (a === "presign") { setState({ confirming: true }); }
  else if (a === "cancelsign") { setState({ confirming: false }); }
  else if (a === "sign") { log("sign", "", Object.keys(S.decisions).length + " decided"); setState({ screen: "debrief", confirming: false }); window.scrollTo(0, 0); }
  else if (a === "copy") {
    const txt = summaryText();
    const done = () => { S.copied = true; render(); setTimeout(() => { S.copied = false; render(); }, 1800); };
    try { navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt)); } catch (e) { fallbackCopy(txt); }
  }
  else if (a === "retry" || a === "reset") { store.del(keyFor(C)); S = Object.assign(fresh(), { screen: "work", start: Date.now() }); log("start", "", C.mode + " retry"); save(); render(); window.scrollTo(0, 0); }
  else if (a === "home") { setState({ screen: "intro", confirming: false }); window.scrollTo(0, 0); }
}
function fallbackCopy(txt) {
  const ta = $("#copy-fallback"); if (!ta) return;
  ta.hidden = false; ta.value = txt; ta.style.minHeight = "160px"; ta.focus(); ta.select();
}

/* ============ WORKFLOW LAB (engine) ============ */
const LEVERS = LAB.levers;
const CURRENT_CFG = Object.fromEntries(LEVERS.map(l => [l.key, l.options.find(o => o.current).key]));
const cfgKey = cfg => LEVERS.map(l => cfg[l.key]).join("|");
const keyCfg = k => Object.fromEntries(k.split("|").map((v, i) => [LEVERS[i].key, v]));
const optOf = (lever, key) => LEVERS.find(l => l.key === lever).options.find(o => o.key === key);
const changedLevers = cfg => LEVERS.filter(l => cfg[l.key] !== CURRENT_CFG[l.key]);
const BASE_KEY = cfgKey(CURRENT_CFG);
const PILOT_MAX = 2;
const TARGET_DAYS = 2; // teaching target for response time, not a clinical standard
const PREDICT_OPTS = [
  ["E3", "Discharge: what the summary says is pending"],
  ["E5", "Routing: who receives the final read"],
  ["E6", "What the recipient does with it"],
  ["E7", "What the PCP learns"],
  ["new", "A step that did not exist before"]
];

function auditCatches(r) { return r.recommendation && !r.order && !r.noActionDecision; }
const ALL_CFGS = LEVERS.reduce((acc, lv) => acc.flatMap(c => lv.options.map(o => ({ ...c, [lv.key]: o.key }))), [{}]);

/* The replay model. Every event records which of the learner's rules changed it (cause) and which original event it replaces (ref). */

function validateLab(l) {

  if (!l.central.options.some(o => o.v === "accepted")) errs.push("Central question has no accepted answer");
  l.central.options.forEach(o => o.cites.forEach(id => { if (!evIds.has(id)) errs.push("Central option " + o.key + " cites missing " + id); }));
  l.questions.forEach(q => {
    if (!q.options.some(o => o.v === "accepted")) errs.push(q.id + " has no accepted answer");
    [...q.evidence.must, ...q.evidence.anyOf].forEach(id => { if (!evIds.has(id)) errs.push(q.id + " cites missing " + id); });

}

  return `<div class="patient"><strong>${esc(P.name)}</strong><span>${P.age} ${esc(P.sex)}</span><span class="mono">MRN ${esc(P.mrn)}</span><span>${esc(P.context)}</span><span class="mode lab">Workflow lab</span></div>`;
}

function labView() {
  const body = L.screen === "brief" ? labBrief() : L.screen === "investigate" ? labInvestigate() : L.screen === "redesign" ? labRedesign() : L.screen === "replay" ? labReplay() : labDebrief();
  return labTop() + stepper() + patientBar() + body;
}

function labBrief() {
  return `<section class="brief panel">
    <p class="label">Incident report · patient safety committee</p>
    <h2>${esc(LAB.title)}</h2>
    ${LAB.brief.map(p => `<p>${esc(p)}</p>`).join("")}
    <div class="task"><div class="task-text"><p><span class="label">Your role</span>${esc(LAB.role)}</p></div></div>
    <div><button class="btn primary" data-lab="investigate">Start the investigation</button></div>
  </section>`;
}

function labInvestigate() {
  const lit = new Set(LAB.events.filter(e => L.opened.includes(e.id)).flatMap(e => e.states));
  const ev = LAB.events.find(e => e.id === L.ev);
  const unlocked = L.opened.length >= LAB.minOpenForQuestions;
  const C0 = LAB.central, opt = C0.options.find(o => o.key === L.answers.Q0), sel = L.cites.Q0 || [], ec = centralCheck(), cv = centralVerdict();
  const done = investigationReady();
  const showForm = !done || !L.qCollapsed || L.editQ;
  return `
  <div class="task"><div class="task-text"><p><span class="label">Step 1 · Investigate</span>Open each event to see where its information came from.</p></div><span class="pill">${L.opened.length} of ${LAB.events.length} events opened</span></div>
  <div class="panel chain-panel">${chain(lit, false, "States the record can confirm so far")}</div>
  <div class="lab-grid">
    <section class="panel" aria-label="Timeline">
      <div class="pane-head"><span class="label">Timeline</span></div>
      <div class="pane-body tl">${LAB.events.map(e => `<button class="ev ${L.opened.includes(e.id) ? "opened" : ""}" data-ev="${e.id}" aria-current="${L.ev === e.id}"><span class="mono">${e.id}</span><span><span class="ev-when">${esc(e.when)}</span><strong>${esc(e.title)}</strong><span class="ev-actor">${esc(e.actor)}</span></span><span class="mk">${L.opened.includes(e.id) ? "read" : "open"}</span></button>`).join("")}</div>
    </section>
    <section class="panel" aria-label="Evidence">
      <div class="pane-head"><span class="label">Evidence${ev ? ` · <span class="mono">${ev.id}</span>` : ""}</span></div>
      <div class="pane-body">${ev ? `<h3 class="ev-title">${esc(ev.title)}</h3><p class="ev-meta">${esc(ev.when)} · ${esc(ev.actor)}</p><p>${esc(ev.detail)}</p>
        <table class="prov-table"><tbody>${ev.prov.map(([k, v]) => `<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">Select an event on the timeline to see its record.</p>`}</div>
    </section>
  </div>
  <section class="panel sec" aria-label="Your finding">
    <h3>Your finding</h3>
    ${!unlocked ? `<p class="locked">Open at least ${LAB.minOpenForQuestions} events to unlock the question.</p>` : showForm ? `
      <fieldset class="q"><legend>${esc(C0.prompt)} <span class="req">Required</span></legend><p class="example-note">More than one answer can be defensible. Pick the one you would argue for, then cite the events that support it.</p>
        <div class="opts">${C0.options.map(o => `<label class="opt"><input type="radio" name="Q0" id="Q0-${o.key}" value="${o.key}" data-q="Q0" ${L.answers.Q0 === o.key ? "checked" : ""}><span>${esc(o.text)}</span></label>`).join("")}</div>
        ${opt ? `<div class="cite-row"><span class="label">Evidence</span>${LAB.events.map(e => `<label class="cite-chip ${sel.includes(e.id) ? "sel" : ""}" title="${esc(L.opened.includes(e.id) ? e.title : "Open " + e.id + " on the timeline first")}"><input type="checkbox" id="cite-Q0-${e.id}" data-cite-q="Q0" value="${e.id}" ${sel.includes(e.id) ? "checked" : ""} ${!sel.includes(e.id) && (sel.length >= 3 || !L.opened.includes(e.id)) ? "disabled" : ""}>${e.id}</label>`).join("")}</div>` : ""}
        ${cv ? `<div class="fb ${cv.cls}"><strong>${esc(cv.head)}</strong><span>${esc(opt.fb)}</span><span class="ref">${esc(ec[1])}</span></div>` : opt ? `<p class="example-note">Cite at least one event you have opened to see feedback.</p>` : ""}
        ${done && L.editQ ? `<div><button class="btn" data-lab="doneq">Done</button></div>` : ""}
      </fieldset>` : `
      <div class="summary-card"><p><span class="v ${cv.cls}">${esc(cv.head)}</span></p><p>${esc(opt.text)}</p><p class="example-note">${esc(opt.fb)}</p><p class="example-note">Evidence cited: ${esc(sel.join(", "))}. ${esc(ec[1])}</p><button class="btn ghost" style="justify-self:start;padding:2px 0" data-lab="editq">Change my answer</button></div>`}
    ${unlocked ? `<details class="optional-q"><summary>Optional: two more questions about the record (not needed to continue)</summary>${LAB.questions.map(q => {
      const a = L.answers[q.id], o2 = a ? q.options.find(x => x.key === a) : null;
      return `<fieldset class="q"><legend>${esc(q.prompt)}</legend><div class="opts">${q.options.map(o => `<label class="opt"><input type="radio" name="${q.id}" id="${q.id}-${o.key}" value="${o.key}" data-q="${q.id}" ${a === o.key ? "checked" : ""}><span>${esc(o.text)}</span></label>`).join("")}</div>${o2 ? `<div class="fb ${o2.v}"><strong>${VERDICT_LABEL[o2.v]}</strong><span>${esc(o2.fb)}</span></div>` : ""}</fieldset>`;
    }).join("")}</details>` : ""}
    ${todoList([
      { text: "Open at least " + LAB.minOpenForQuestions + " events on the timeline (" + Math.min(L.opened.length, LAB.minOpenForQuestions) + " of " + LAB.minOpenForQuestions + ")", done: L.opened.length >= LAB.minOpenForQuestions },
      { text: "Choose where the process first broke down", done: !!opt && opt.v !== "not" },
      { text: "Cite at least one event that supports your answer", done: !!(cv && cv.ec[0] === "accepted") }
    ])}
    <div><button class="btn primary" data-lab="redesign" ${done ? "" : "disabled"}>Continue to redesign</button></div>
  </section>`;
}

function labRedesign() {
  const cfg = L.cfg, ch = changedLevers(cfg), sim = simulate(cfg, false), key = cfgKey(cfg);
  const pilot = isPilot(), over = pilot && ch.length > PILOT_MAX, none = ch.length === 0;
  const pred = L.pred[key] || {};
  const todo = redesignTodo(), ready = todo.every(i => i.done);
  const open = L.openLever || LEVERS[0].key;
  return `
  <div class="task"><div class="task-text"><p><span class="label">Step 2 · Redesign</span>${pilot ? `Pilot: you can change ${PILOT_MAX} rules. Choose which failures to address first.` : "Pilot done. Change as many rules as you like."} Click an option to see its tradeoffs.</p></div><span class="pill ${over ? "warn" : ""}">${pilot ? ch.length + " of " + PILOT_MAX + " pilot changes used" : ch.length + " rule" + (ch.length === 1 ? "" : "s") + " changed"} · ${sim.workLabel.toLowerCase()} added work</span></div>
  <div class="levers">${LEVERS.map((lv, n) => {
    const sel = optOf(lv.key, cfg[lv.key]), isOpen = open === lv.key;
    return `<section class="panel lever ${isOpen ? "open" : ""}">
      <div class="lever-head"><span class="mono lever-n">${n + 1}</span><div><h3>${esc(lv.q)}</h3><span class="finding">Finding: ${esc(lv.finding)}</span></div></div>
      <div class="chips-row" role="radiogroup" aria-label="${esc(lv.q)}">${lv.options.map(o => `<label class="chip-opt ${cfg[lv.key] === o.key ? "sel" : ""}"><input type="radio" name="lv-${lv.key}" id="lv-${lv.key}-${o.key}" value="${o.key}" data-lever="${lv.key}" ${cfg[lv.key] === o.key ? "checked" : ""}>${esc(o.short)}${o.current ? `<span class="cur-dot" title="Current hospital setting">current</span>` : ""}</label>`).join("")}</div>
      ${isOpen ? `<div class="lever-detail">
        <p class="lever-full">${esc(sel.label)}</p>
        <ul class="pc">${sel.pros.map(p => `<li class="pro">${esc(p)}</li>`).join("")}${sel.cons.map(c => `<li class="con">${esc(c)}</li>`).join("")}</ul>
        ${sel.work ? `<p class="work">Added work: ${esc(sel.workText)}</p>` : ""}
        <details><summary>Why this rule matters</summary><p class="example-note">${esc(lv.why)}</p><p class="example-note"><strong>Evidence:</strong> ${esc(lv.evidence)}</p></details>
      </div>` : `<button class="btn ghost lever-more" data-open-lever="${lv.key}">Show tradeoffs</button>`}
    </section>`;
  }).join("")}</div>
  <section class="panel sec">
    <fieldset class="q"><legend>Why does this design fit this hospital? <span class="req">Required</span></legend>
      <p class="example-note">Pick at least one reason, or write your own.</p>
      <div class="reason-row">${LAB.reasons.map((r, i) => `<label class="chip-opt ${(L.reasons || []).includes(i) ? "sel" : ""}"><input type="checkbox" id="reason-${i}" data-reason="${i}" ${(L.reasons || []).includes(i) ? "checked" : ""}>${esc(r)}</label>`).join("")}</div>
      <label for="rationale" class="label">In your own words <span class="opt-tag">Optional</span></label>
      <textarea id="rationale" data-rationale placeholder="One or two sentences.">${esc(L.rationale)}</textarea>
    </fieldset>
    ${pilot ? "" : `<details class="optional-q"${pred.ev ? " open" : ""}><summary>Optional: make a prediction for this replay</summary>`}<fieldset class="q predict"><legend>${pilot ? "Before you replay: which" : "Which"} event should change first under your design? ${pilot ? '<span class="req">Required</span>' : ""}</legend>
      <div class="opts">${PREDICT_OPTS.map(([v, t]) => `<label class="opt"><input type="radio" name="pred" id="pred-${v}" value="${v}" data-pred ${pred.ev === v ? "checked" : ""}><span>${esc(t)}</span></label>`).join("")}</div>
      <label for="pred-risk" class="label">What could still fail? <span class="opt-tag">Optional</span></label>
      <textarea id="pred-risk" data-pred-risk placeholder="Optional. One sentence.">${esc(pred.risk || "")}</textarea>
    </fieldset>${pilot ? "" : "</details>"}
    <details><summary>About the numbers</summary><p class="example-note">${esc(LAB.volumeNote)}</p></details>
    ${todoList(todo)}
    <div class="actions-row"><button class="btn primary" data-lab="run" ${ready ? "" : "disabled"}>${pilot ? "Run the pilot replay" : L.tried.includes(key) ? "Replay this design again" : "Replay the incident"}</button><button class="btn" data-lab="current">Reset to current</button>${L.tried.length ? `<button class="btn ghost" data-lab="compare">Compare designs so far</button>` : ""}<button class="btn ghost" data-lab="investigate">Back to the evidence</button></div>
  </section>`;
}

function tradeoffLine(k) {
  const b = simulate(keyCfg(k), false), parts = [];
  parts.push(b.planDay ? "disposition by Day " + b.planDay : "no disposition");
  parts.push(b.workLabel.toLowerCase() + " added work");
  if (L.stressTried.includes(k)) { const s = simulate(keyCfg(k), true); parts.push(!s.planDay ? "breaks when the clinician is away" : b.planDay && s.planDay - b.planDay <= 2 ? "holds when the clinician is away" : "slows to Day " + s.planDay + " when the clinician is away"); }
  else if (k !== BASE_KEY) parts.push("not stress-tested yet");
  const t = parts.join(", ");
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function compareView(highlight) {
  const keys = [BASE_KEY, ...designList()];
  const card = k => {
    const cfg = keyCfg(k), b = simulate(cfg, false), ch = changedLevers(cfg);
    const st = L.stressTried.includes(k) ? simulate(cfg, true) : null;
    const pros = [...new Set(ch.flatMap(l => optOf(l.key, cfg[l.key]).pros))].slice(0, 4);
    const cons = [...new Set((ch.length ? ch : LEVERS).flatMap(l => optOf(l.key, cfg[l.key]).cons))].slice(0, 4);
    return `<article class="cmp ${k === highlight ? "hl" : ""}">
      <header><strong>${esc(designName(k))}</strong>${k === highlight ? `<span class="cur-tag">This replay</span>` : ""}</header>
      <p class="tradeoff">${esc(tradeoffLine(k))}</p>
      <div class="cmp-out"><span class="label">Base</span><span class="v ${OUTCOME_CLASS[b.outcome.kind]}">${esc(b.outcome.label)}</span></div>
      ${st ? `<div class="cmp-out"><span class="label">Stress</span><span class="v ${OUTCOME_CLASS[st.outcome.kind]}">${esc(st.outcome.label)}</span></div>` : ""}
      <div class="chg-chips">${changeTags(cfg).map(c => `<span class="mini">${esc(c)}</span>`).join("")}</div>
      ${(() => { const sn = latestSnap(k); if (!sn) return ""; return `<p class="cmp-why"><span class="label">Your reasoning</span> ${esc(sn.rationale || "(none recorded)")}</p>${sn.pred && sn.pred.ev ? `<p class="cmp-why"><span class="label">Prediction</span> ${esc(predText(sn.pred.ev))}${b.firstRef ? (sn.pred.ev === b.firstRef ? " · matched the replay" : " · the replay changed " + esc(predText(b.firstRef).toLowerCase()) + " first") : ""}</p>` : ""}`; })()}
      <details><summary>Pros and cons</summary><ul class="pc">${pros.map(p => `<li class="pro">${esc(p)}</li>`).join("")}${cons.map(c => `<li class="con">${esc(c)}</li>`).join("")}</ul></details>
    </article>`;
  };
  return `<section class="panel sec" aria-label="Compare designs">
    <h3>Compare designs</h3>
    <p class="example-note">No design wins everywhere. Each line names what the design gains and what it costs.</p>
    <div class="cmp-grid">${keys.map(card).join("")}</div>
  </section>`;
}

function labReplay() {
  const cfg = keyCfg(L.combo), R = simulate(cfg, L.stress);
  const shown = R.events.slice(0, L.step + 1), done = L.step >= R.events.length - 1;
  const lit = new Set(shown.flatMap(e => e.states));
  const pred = L.pred[L.combo] || {};
  const lbl = k => optOf(k, cfg[k]).short;
  const snapPred = (latestSnap(L.combo) || {}).pred || pred;
  const predTxt = predText(snapPred.ev);
  const actualTxt = R.firstRef ? predText(R.firstRef) : "Nothing changed";
  const groups = ["literature", "scenario"].map(g => ({ g, items: LAB.assumptions.filter(a => a.basis === g) }));
  return `
  <div class="task"><div class="task-text"><p><span class="label">Step 3 · ${L.stress ? "Stress test" : "Replay"}</span>${L.stress ? esc(LAB.stress.text) : "Same result, same people, your rules."}</p><div class="chg-chips">${changeTags(cfg).map(c => `<span class="mini">${esc(c)}</span>`).join("")}</div></div><span class="pill">Event ${L.step + 1} of ${R.events.length}</span></div>
  <div class="panel chain-panel">${chain(lit, done, L.stress ? "Under this design, with the clinician away" : "Under this design", true)}</div>
  <section class="panel sec">
    <ol class="replay">${shown.map((e, i) => `<li class="${i === L.step ? "new" : ""} ${e.win ? "win" : ""}"><span class="ev-when">${esc(e.when)}</span><strong>${esc(e.title)}</strong>${e.cause.length ? `<span class="because">Changed by your rule${e.cause.length > 1 ? "s" : ""}: ${esc(e.cause.map(lbl).join(", "))}</span>` : ""}${i === L.step || e.win ? `<p>${esc(e.detail)}</p>` : ""}</li>`).join("")}</ol>
    ${done ? "" : `<div class="actions-row"><button class="btn primary" data-lab="next">Next event</button><button class="btn ghost" data-lab="skip">Skip to the outcome</button></div>`}
  </section>
  ${done ? `<section class="panel sec outcome">
    <div class="fb ${OUTCOME_CLASS[R.outcome.kind]}"><strong>${esc(R.outcome.label)}</strong><span>${esc(R.outcome.text)}</span></div>
    <dl class="trace"><dt>Received the task</dt><dd>${esc(R.trace.received)}</dd><dt>Accepted responsibility</dt><dd>${esc(R.trace.accepted)}</dd><dt>What prompted action</dt><dd>${esc(R.trace.prompt)}</dd><dt>Disposition documented</dt><dd>${esc(R.trace.disposition)}</dd><dt>Open tasks left</dt><dd>${esc(R.openTasks)}</dd></dl>
    ${L.stress ? `<div class="research-note"><span class="label">Why the stress test came out this way</span><p>${esc(stressWhy(cfg, R))}</p></div>` : ""}
    ${!L.stress && snapPred.ev ? `<div class="pred-check ${snapPred.ev === R.firstRef ? "match" : ""}"><p><span class="label">Your prediction</span> ${esc(predTxt)}</p><p><span class="label">First change in the replay</span> ${esc(actualTxt)}</p>${snapPred.risk ? `<p><span class="label">What you thought could still fail</span> ${esc(snapPred.risk)}</p>` : ""}</div>` : ""}
    <details><summary>Added work under this design</summary><ul class="points" style="margin-top:6px">${(R.workload.length ? R.workload : ["No added work beyond the current design."]).map(w => `<li>${esc(w)}</li>`).join("")}</ul><p class="example-note" style="margin-top:6px">Volumes are illustrative.</p></details>
    <details><summary>How this replay is calculated</summary><p class="example-note" style="margin-top:6px">A teaching model with fixed rules, not a prediction of real-world rates.</p>${groups.map(({ g, items }) => `<p class="label" style="margin-top:8px">${g === "literature" ? "Informed by the literature" : "Scenario assumptions written for this lab"}</p><ul class="points">${items.map(a => `<li>${esc(a.text)}</li>`).join("")}</ul>`).join("")}<p class="label" style="margin-top:8px">Checks on how the rules interact</p><ul class="points">${MODEL_CHECKS.map(c => `<li><strong>${esc(c.q)}</strong> ${esc(c.a)}${c.pass ? "" : " (Check failed.)"}</li>`).join("")}</ul></details>
  </section>
  ${compareView(L.combo)}
  <div class="actions-row">${!L.stress ? `<button class="btn primary" data-lab="stress">Stress test this design</button>` : `<button class="btn" data-lab="base">Back to the base replay</button>`}<button class="btn" data-lab="redesign">Try another design</button><button class="btn ghost" data-lab="debrief">Go to the debrief</button></div>` : ""}`;
}

function mcBlock(q, ans, scope) {
  const sel = ans[q.id] || [];
  const picked = sel.map(i => q.options[i]);
  let fb = "";
  if (sel.length) {
    if (q.multi) {
      const wrong = picked.some(o => o.v === "not"), all = q.options.every((o, i) => o.v === "not" || sel.includes(i));
      fb = `<div class="fb ${wrong ? "not" : all ? "accepted" : "partial"}"><strong>${wrong ? "Not quite" : all ? "All of them" : "More to consider"}</strong><span>${esc(q.fb)}</span></div>`;
    } else { const o = picked[0]; fb = `<div class="fb ${o.v}"><strong>${VERDICT_LABEL[o.v]}</strong><span>${esc(o.fb)}</span></div>`; }
  }
  return `<fieldset class="q"><legend>${esc(q.prompt)}</legend><div class="opts">${q.options.map((o, i) => `<label class="opt"><input type="${q.multi ? "checkbox" : "radio"}" name="${scope}-${q.id}" id="${scope}-${q.id}-${i}" data-mc="${scope}|${q.id}|${i}|${q.multi ? 1 : 0}" ${sel.includes(i) ? "checked" : ""}><span>${esc(o.text)}</span></label>`).join("")}</div>${fb}</fieldset>`;
}
function bindMC(ans, saveFn, scope) {
  document.querySelectorAll(`[data-mc^="${scope}|"]`).forEach(inp => inp.onchange = () => {
    const [, id, i, multi] = inp.dataset.mc.split("|"), n = Number(i), cur = ans[id] || [];
    ans[id] = multi === "1" ? (inp.checked ? [...new Set([...cur, n])] : cur.filter(x => x !== n)) : [n];
    saveFn(); render();
  });
}

function stressWhy(cfg, R) {
  const b = simulate(cfg, false);
  if (!b.planDay && R.planDay) return "The absence kept the task open long enough for " + R.by + " to pick it up on Day " + R.planDay + ". With the clinician present, an acknowledgment closed the task first, so there was nothing left to catch. Systems can detect a task that sits untouched while missing one that was closed without a plan.";
  if (b.planDay && !R.planDay) return "With the clinician away, nothing else moved the task, so no disposition was documented. In the base replay, " + b.by + " acted on Day " + b.planDay + ".";
  if (b.planDay && R.planDay && R.planDay > b.planDay) return "The task waited until " + R.by + " acted on Day " + R.planDay + ". In the base replay, " + b.by + " acted on Day " + b.planDay + ". Your design depends on that clinician being there.";
  if (b.planDay && R.planDay) return "The absence did not change the outcome: " + R.by + " acted on Day " + R.planDay + ", the same as in the base replay. Your design does not depend on one person being available.";
  return "Neither scenario produced a disposition. The absence changed who held the task, but no rule made anyone act on it.";
}

function labDebrief() {
  const origLit = new Set(LAB.events.flatMap(e => e.states));

    <div class="panel sec">
      ${chain(origLit, true, "The original incident", true)}
      ${last ? chain(new Set(simulate(keyCfg(last), false).events.flatMap(e => e.states)), true, designName(last) + " (your latest)", true) : ""}
      <p class="example-note">An acknowledgment records a click. Responsibility is accepted when someone takes the task as theirs. A disposition records the decision. Whether the scan happens months later is a separate step the replay does not show.</p>
    </div>
    ${compareView(last)}
    ${anyAuto ? `<div class="event gap" role="note"><p class="label">A gap some of your designs left open</p><p>${esc(LAB.residualGap)}</p></div>` : ""}
    <div class="panel sec">
      <h3>The published question</h3>
      <p>Dalal and colleagues assigned responsibility to the discharging attending and notified clinicians directly. Documented action came sooner, but the share of actionable results with any documented follow-up did not change significantly, and about 40% had none. Why might explicit responsibility and notification still fail to produce reliable follow-up?</p>

    </div>
    <div class="panel sec">
      <h3>Check your understanding</h3>
      ${LAB.reflectMC.map(q => mcBlock(q, L.refl || (L.refl = {}), "lab")).join("")}
      <details class="optional-q"><summary>Optional: write your own reflection</summary><ol style="margin:0 0 8px;padding-left:20px;display:grid;gap:4px">${LAB.reflect.map(q => `<li>${esc(q)}</li>`).join("")}</ol><textarea id="lab-reflect" data-lab-reflect placeholder="A few sentences.">${esc(L.reflection)}</textarea></details>
      <details><summary>Going further: ${esc(LAB.goingFurther.q)}</summary><p class="example-note" style="margin-top:6px">${esc(LAB.goingFurther.example)}</p></details>
    </div>
    <details class="panel sec fold">
      <summary><h3>The research behind this lab</h3></summary>
      <div class="refs">${LAB.research.map(r => `<div class="ref"><a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">${esc(r.cite)}</a><p>${esc(r.text)}</p></div>`).join("")}</div>
    </details>
    <div class="panel sec">
      <h3>Session record</h3>
      <details><summary>Show the action log</summary><div class="log" style="margin-top:6px">${L.log.map(e => `<span>${esc(e.t)}  ${esc(e.action.padEnd(9))} ${esc(e.detail)}</span>`).join("") || "<span>No actions logged.</span>"}</div></details>
      <div class="actions-row"><button class="btn" data-lab="copy">Copy session summary</button><button class="btn" data-lab="redesign">Try another design</button><button class="btn primary" data-lab="reset">Start the lab over</button><button class="btn ghost" data-lab="home">All modules</button>${L.copied ? `<span class="toast" aria-live="polite">Copied</span>` : ""}</div>
      <textarea id="copy-fallback" readonly hidden></textarea>
    </div>
  </section>`;
}

function labSummary() {
  const lines = [`Provenance Lab · ${LAB.id} v${LAB.version}`, ""];
  const o0 = LAB.central.options.find(x => x.key === L.answers.Q0), ec0 = centralCheck();
  const cv0 = centralVerdict();
  lines.push(`Finding: ${o0 ? o0.text : "(unanswered)"} | Evidence: ${(L.cites.Q0 || []).join(", ") || "none"}${cv0 ? " | " + cv0.head : ""}`);
  LAB.questions.forEach(q => { const o = q.options.find(x => x.key === L.answers[q.id]); if (o) lines.push(`${q.id}: ${o.text} (${VERDICT_LABEL[o.v]})`); });
  lines.push("", "Replays started, in order (outcomes shown only for replays the learner finished):");
  (L.snaps || []).forEach((sn, i) => {
    const r = simulate(keyCfg(sn.key), sn.scenario === "stress");
    lines.push(`${i + 1}. ${designName(sn.key)}, ${sn.scenario === "stress" ? "stress test" : "base scenario"}: ${changeTags(keyCfg(sn.key)).join("; ")} -> ${sn.completed ? r.outcome.label + ". Open tasks: " + r.openTasks : "started, not finished"}`);
    if (sn.scenario === "base") {
      lines.push(`   Reasoning: ${sn.rationale || "(none)"}`);
      if (sn.pred && sn.pred.ev) lines.push(`   Prediction: ${predText(sn.pred.ev)}.${sn.completed ? " First change in the replay: " + (r.firstRef ? predText(r.firstRef) : "nothing") + "." : ""}${sn.pred.risk ? " Could still fail: " + sn.pred.risk : ""}`);
    }
  });
  const rc = LAB.reflectMC.filter(q => (L.refl || {})[q.id]);
  if (rc.length) { lines.push("", "Understanding checks:"); rc.forEach(q => lines.push(`- ${q.prompt} ${(L.refl[q.id] || []).map(i => q.options[i].text).join(" | ")}`)); }
  lines.push("", "Reflection: " + (L.reflection || "(none)"), "", "Log:");
  L.log.forEach(e => lines.push(`${e.t} ${e.action} ${e.detail}`.trim()));
  return lines.join("\n");
}

function bindLab() {
  document.querySelectorAll("[data-lab]").forEach(b => b.onclick = () => labAct(b.dataset.lab));
  document.querySelectorAll("[data-ev]").forEach(b => b.onclick = () => {
    const id = b.dataset.ev;
    if (!L.opened.includes(id)) { L.opened.push(id); labLog("open", id); }
    labSet({ ev: id });
    if (window.innerWidth <= 900) document.querySelector(".lab-grid > section:nth-child(2)")?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  document.querySelectorAll("[data-q]").forEach(r => r.onchange = () => { L.answers[r.dataset.q] = r.value; labLog("answer", r.dataset.q + " " + r.value); labSave(); render(); });
  document.querySelectorAll("[data-cite-q]").forEach(c => c.onchange = () => {
    const q = c.dataset.citeQ, cur = L.cites[q] || [];
    L.cites[q] = c.checked ? [...cur, c.value].slice(0, 3) : cur.filter(x => x !== c.value);
    labSave(); render();
  });
  document.querySelectorAll("[data-lever]").forEach(r => r.onchange = () => { L.cfg = { ...L.cfg, [r.dataset.lever]: r.value }; L.openLever = r.dataset.lever; labSave(); render(); });
  document.querySelectorAll("[data-open-lever]").forEach(b => b.onclick = () => labSet({ openLever: b.dataset.openLever }));
  document.querySelectorAll("[data-pred]").forEach(r => r.onchange = () => { const k = cfgKey(L.cfg); L.pred[k] = { ...(L.pred[k] || {}), ev: r.value }; labSave(); render(); });
  const pr = document.querySelector("[data-pred-risk]");
  if (pr) pr.oninput = () => { const k = cfgKey(L.cfg); L.pred[k] = { ...(L.pred[k] || {}), risk: pr.value }; labSave(); };
  document.querySelectorAll("[data-reason]").forEach(c => c.onchange = () => {
    const i = Number(c.dataset.reason), cur = L.reasons || [];
    L.reasons = c.checked ? [...new Set([...cur, i])] : cur.filter(x => x !== i);
    labSave(); render();
  });
  const ra = document.querySelector("[data-rationale]");
  if (ra) ra.oninput = () => {
    const before = hasRationale();
    L.rationale = ra.value; labSave();
    if (before !== hasRationale()) render();
  };
  const rf = document.querySelector("[data-lab-reflect]"); if (rf) rf.oninput = () => { L.reflection = rf.value; labSave(); };
  if (ACTIVE === "lab" && L.screen === "debrief") bindMC(L.refl || (L.refl = {}), labSave, "lab");
}

function labAct(a) {
  const top = () => window.scrollTo(0, 0);
  if (a === "home") { if (L.screen !== "home") L.resume = L.screen; L.screen = "home"; labSave(); render(); top(); }
  else if (a === "begin") { if (!L.start) { L.start = Date.now(); labLog("start"); } labSet({ screen: L.resume || "brief" }); top(); }
  else if (a === "investigate") { labSet({ screen: "investigate" }); top(); }
  else if (a === "editq") { labSet({ editQ: true }); }
  else if (a === "doneq") { labSet({ editQ: false }); }
  else if (a === "redesign") { if (investigationReady()) L.qCollapsed = true; labSet({ screen: "redesign", editQ: false }); top(); }
  else if (a === "current") { labSet({ cfg: { ...CURRENT_CFG } }); }
  else if (a === "compare") { if (L.tried.length) { const k = L.tried[L.tried.length - 1]; L.combo = k; L.stress = false; L.step = simulate(keyCfg(k), false).events.length - 1; labSet({ screen: "replay" }); } top(); }
  else if (a === "run") { const k = cfgKey(L.cfg); labLog(isPilot() ? "pilot" : "replay", changeTags(L.cfg).join("; ")); takeSnap(k, "base"); labSet({ screen: "replay", combo: k, stress: false, step: 0 }); top(); }
  else if (a === "stress") { labLog("stress", designName(L.combo)); takeSnap(L.combo, "stress"); labSet({ stress: true, step: 0 }); top(); }
  else if (a === "base") { L.stress = false; L.step = simulate(keyCfg(L.combo), false).events.length - 1; labSave(); render(); top(); }
  else if (a === "next" || a === "skip") {
    const R = simulate(keyCfg(L.combo), L.stress);
    L.step = a === "skip" ? R.events.length - 1 : Math.min(L.step + 1, R.events.length - 1);
    if (L.step === R.events.length - 1) {
      const sc = L.stress ? "stress" : "base", open = [...(L.snaps || [])].reverse().find(sn => sn.key === L.combo && sn.scenario === sc && !sn.completed);
      if (open) open.completed = true;
      const list = L.stress ? L.stressTried : L.tried;
      if (!list.includes(L.combo)) { list.push(L.combo); labLog(L.stress ? "stressed" : "outcome", designName(L.combo) + ": " + R.outcome.label); }
    }
    labSave(); render();
  }
  else if (a === "debrief") { labSet({ screen: "debrief" }); top(); }
  else if (a === "reset") { store.del(labKey()); L = Object.assign(labFresh(), { screen: "brief", start: Date.now() }); labLog("start", "reset"); labSave(); render(); top(); }
  else if (a === "copy") {
    const txt = labSummary();
    const done = () => { L.copied = true; render(); setTimeout(() => { L.copied = false; render(); }, 1800); };
    try { navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt)); } catch (e) { fallbackCopy(txt); }
  }
}

engineChecks().filter(([, ok]) => !ok).forEach(([name]) => LAB_ERRORS.push("Engine check failed: " + name));
render();
</script>
</body>
